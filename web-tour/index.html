<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Killarney Interior 360 Tour</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2310100d'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23f4b45f' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%2369c2a3'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/pannellum.css?v=20260801-editor-v12" />
    <link rel="stylesheet" href="css/tour.css?v=20260815-room-title-repair-v1" />
  </head>
  <body>
    <main class="tour-shell">
      <div id="panorama" class="viewer" aria-label="360 virtual tour"></div>

      <header class="topbar">
        <a class="tour-brand" href="https://raindigit.ie/" target="_blank" rel="noopener noreferrer" aria-label="Visit RainDigit">
          <img class="tour-brand__mark" src="assets/raindigit-mark.svg" alt="" aria-hidden="true" />
          <span class="tour-brand__text">
            <strong>RainDigit</strong>
            <small>3D tour</small>
          </span>
        </a>
        <div class="toolbar" aria-label="Tour controls">
          <button class="icon-button icon-button--rooms" id="navigatorToggle" type="button" aria-expanded="false" aria-controls="navigatorPanel" aria-label="Show room navigator" title="Show room navigator">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16" />
              <path d="M4 12h16" />
              <path d="M4 18h16" />
            </svg>
            <span class="icon-button__label">Rooms</span>
          </button>
          <button class="icon-button" id="mapToggle" type="button" hidden aria-expanded="false" aria-controls="floorplanPanel" aria-label="Show floorplan" title="Show floorplan">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z" />
              <path d="M9 3v15" />
              <path d="M15 6v15" />
            </svg>
          </button>
          <button class="icon-button" id="resetView" type="button" aria-label="Reset current view" title="Reset current view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v6h6" />
            </svg>
          </button>
          <button class="icon-button" id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5" />
              <path d="M16 3h5v5" />
              <path d="M21 16v5h-5" />
              <path d="M8 21H3v-5" />
            </svg>
          </button>
        </div>
      </header>

      <aside class="scene-panel" id="navigatorPanel" aria-label="Tour navigator">
        <div class="scene-panel__header">
          <div>
            <span>Rooms and views</span>
            <strong id="sceneCounter">View 1 of 4</strong>
          </div>
          <button class="icon-button icon-button--small" id="navigatorClose" type="button" aria-label="Close tour navigator" title="Close tour navigator">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12" />
              <path d="m18 6-12 12" />
            </svg>
          </button>
        </div>
        <div id="routeStrip" class="route-strip" aria-label="Tour route"></div>
        <div id="sceneList" class="scene-list"></div>
      </aside>

      <section class="floorplan-panel" id="floorplanPanel" hidden aria-label="Floorplan">
        <header class="floorplan-panel__header">
          <strong>Floorplan</strong>
          <button class="icon-button icon-button--small" id="floorplanClose" type="button" aria-label="Close floorplan" title="Close floorplan">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12" /><path d="m18 6-12 12" /></svg>
          </button>
        </header>
        <div class="floorplan-panel__canvas" id="floorplanCanvas"></div>
      </section>
    </main>

    <script src="js/tour-bootstrap.js?v=20260815-link-back-v1"></script>
  </body>
</html>

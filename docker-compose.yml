services:
  studio:
    init: true
    build:
      context: .
      target: studio
    working_dir: /workspace
    command: ["node", "scripts/tour-editor-server.mjs", "--port", "8767"]
    environment:
      TOUR_SERVER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8767:8767"
    volumes:
      - .:/workspace
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8767/__tour-editor/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  preview:
    build:
      context: .
      target: studio
    working_dir: /workspace
    command: ["node", "scripts/tour-editor-server.mjs", "--preview", "--port", "8768"]
    environment:
      TOUR_SERVER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8768:8768"
    volumes:
      - .:/workspace

  release:
    profiles: ["release"]
    build:
      context: .
      target: release
    ports:
      - "127.0.0.1:8080:8080"
